name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos-build
            build_command: npm run build:mac
            artifact_glob: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            artifact_name: windows-build
            build_command: npm run build:win
            artifact_glob: |
              dist/*.exe
              dist/*.msi
              dist/*-win.zip
          - os: ubuntu-latest
            artifact_name: linux-build
            build_command: npm run build:linux
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb
              dist/*.snap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build platform package
        run: ${{ matrix.build_command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
